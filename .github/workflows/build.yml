name: Build Microtag APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Persistent Signing Key
        run: |
          keytool -genkey -v \
            -keystore app/release.keystore \
            -alias microtag \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass microtagpass \
            -keypass microtagpass \
            -dname "CN=Microtag, OU=Production, O=Microtag, L=Global, S=Global, C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Microtag-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
